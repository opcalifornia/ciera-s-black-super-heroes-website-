services:
  - type: web
    name: book-storefront
    runtime: docker
    plan: starter
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      # SQLite file and uploaded images live on the persistent disk below,
      # so they survive redeploys (Render's own filesystem is ephemeral).
      - key: DB_PATH
        value: /data/store.db
      - key: UPLOAD_DIR
        value: /data/uploads
      - key: PUBLIC_URL
        sync: false # set to your Render/custom domain, e.g. https://your-store.onrender.com
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: SHIP_COUNTRIES
        value: US,CA
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      - key: ADMIN_EMAIL
        sync: false
    disk:
      name: data
      mountPath: /data
      sizeGB: 1
