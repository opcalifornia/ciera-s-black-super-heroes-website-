<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Contact | {store}</title>
<meta name="description" content="">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Newsreader:ital,opsz,wght@0,6..72,400..600;1,6..72,400..600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/styles.css">
</head>
<body data-page="contact">
<div id="app-header"></div>
<main id="MainContent">
<div class="wrap" style="padding-bottom:4rem">
  <div class="page-head"><h1>Contact</h1><p id="contactIntro"></p><p>Email: <span id="contactEmail"></span></p></div>
  <form class="form" id="contactForm" novalidate style="margin-top:2rem">
    <div class="two">
      <label>Name<input type="text" name="name" autocomplete="name" required></label>
      <label>Email<input type="email" name="email" autocomplete="email" required></label>
    </div>
    <label>Phone (optional)<input type="tel" name="phone" autocomplete="tel"></label>
    <label>Message<textarea name="message" required></textarea></label>
    <div><button class="btn" type="submit">Send message</button><p class="status" id="contactStatus" role="status"></p></div>
  </form>
</div>
</main>
<div id="app-footer"></div>
<script src="/js/app.js"></script>
</body>
</html>
